workflows:
  capacitor-android:
    name: Capacitor Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      java: 21
      android_signing:
        - save-money-key
    scripts:
      - name: Install dependencies & Build Web App
        script: |
          cd frontend
          npm install
          npm run build
      - name: Add Android platform and Sync
        script: |
          cd frontend
          npx cap add android || true
          npx cap sync android
      - name: Set up code signing settings
        script: |
          cd frontend/android
          xcode-project use-profiles || true
      - name: Build Android APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - frontend/android/app/build/outputs/apk/release/*.apk
