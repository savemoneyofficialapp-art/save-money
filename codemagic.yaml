workflows:
  capacitor-android:
    name: Capacitor Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18
      android_signing:
        - save-money-key
    scripts:
      - name: Install dependencies & Build Web App
        script: |
          cd frontend
          npm install
          npm run build
      - name: Add Android platform and Sync
        script: |
          cd frontend
          npx cap add android || true
          npx cap sync android
      - name: Build Android APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - frontend/android/app/build/outputs/apk/release/*.apk
